#:schema ../schema/adr.schema.json

[govctl]
id = "ADR-0024"
title = "Broker token-bearing third-party MCP tools"
status = "accepted"
date = "2026-08-24"
refs = [
    "ADR-0002",
    "RFC-0001:C-EGRESS",
]

[content]
context = """
Crucible domains need access to nm-hard-tools, a collection of remote MCP services whose
authentication tokens and network authority are more privileged than the sandboxed agent. Running
nm-hard-tools beside Crucible or injecting its credentials into the sandbox would create a second
privileged path outside Crucible's broker. [[ADR-0002]] already establishes the broker as the
server-side privilege boundary, and [[RFC-0001:C-EGRESS]] requires sandbox egress to remain
deny-by-default with the broker endpoint supplied as engine plumbing. The missing decision is how
third-party, token-bearing MCP services participate in that boundary."""
decision = """
Token-bearing third-party MCP services are exposed only through Crucible's privileged broker. A
domain declares each service under `[[agent.broker.hard_tool]]`; the engine passes the resolved
configuration to the broker, which retains authentication tokens, discovers the upstream tool
catalogue, namespaces every tool as `hard_<service>_<tool>`, and proxies calls over a bounded,
stateless MCP transport. The sandbox sees only the broker endpoint and never receives an upstream
token or direct upstream endpoint. The broker refuses redirects, validates request identifiers, and
bounds response bodies. Upstream discovery failure is fail-fast when broker configuration is
loaded, so a requested capability cannot silently disappear."""
consequences = """
Crucible gains nm-hard-tools without adding another credential-bearing process or sandbox egress
exception. Operators configure secrets once at the broker boundary, tool names cannot collide with
native broker tools, and the proxy has explicit protocol and size limits. The broker now carries
third-party availability and compatibility risk: startup depends on configured upstream discovery,
the proxy must track the supported MCP protocol, and each new upstream expands the broker's
auditing surface."""

[[content.alternatives]]
text = "Proxy token-bearing third-party MCP services through Crucible's privileged broker"
status = "accepted"
pros = [
    "keeps credentials and upstream network authority outside the sandbox",
    "reuses the single broker endpoint already admitted by the sandbox egress policy",
    "centralizes namespacing, protocol validation, redirect policy, and response bounds",
]
cons = [
    "couples broker startup and maintenance to configured upstream MCP services",
    "expands the privileged broker's audit surface",
]

[[content.alternatives]]
text = "Run nm-hard-tools alongside Crucible and connect the sandbox directly"
status = "rejected"
pros = ["keeps third-party protocol code out of the broker"]
cons = [
    "creates a second privileged endpoint and egress path",
    "requires credentials or equivalent authority outside Crucible's broker boundary",
]
rejection_reason = "It violates the single mediated privilege boundary established by [[ADR-0002]]."

[[content.alternatives]]
text = "Give the sandbox upstream tokens and endpoints"
status = "rejected"
pros = ["minimizes server-side implementation"]
cons = [
    "allows agent-controlled code to exfiltrate or misuse long-lived credentials",
    "bypasses broker-side admission, auditing, and response limits",
]
rejection_reason = "The sandbox is not a credential boundary and must not hold upstream authority."
